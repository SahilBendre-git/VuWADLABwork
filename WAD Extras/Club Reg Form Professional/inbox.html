<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Club Registration Form</title>
    <link rel="stylesheet" href="style.css">

    <script>
        window.onload = function() {

                document.write('This page cannot be viewed on such small screens. Sorry')
            }
        }

    <header>
        <nav class="widescr-navbar">
            <div class="navigation-items">
                <b>
                    <a href="index.html" class="navigation-element">Home</a>

            </div>
        </nav>

        <h2 class="web-title">
            Club Registration - Sample Website
        </h2>

    <center>
        <h2>Club Inbox</h2>
    </center>
    
    <style>
        table, tr{
            border: 1px solid;
            border-collapse: collapse;
            padding: 18px;
            width: 200%;
        }
    </style>

    <div style="overflow-x: scroll; width: 80%; margin: 0 auto; border: 2px solid;" id="entryboxx">
        <table border="1" id="EntryTable">
        <tr>
            <th>Sr. no</th>
            <th>Request Id</th>
            <th>Name of Applicant</th>
            <th>Email</th>
            <th>Phone number</th>
            <th>Gender</th>

            <th>Department</th>
            <th>Year of Study</th>
            <th>Selected Club</th>
            <th>Interested in</th>
