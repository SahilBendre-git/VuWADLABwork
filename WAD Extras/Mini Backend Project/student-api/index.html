<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .card {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
        }

        .InputBox {
            margin-bottom: 18px;
        }

        .InputBox label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .InputBox input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        .InputBox input:focus {
            outline: none;
            border-color: #007bff;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        hr {
            margin: 25px 0;
            border: none;
            border-top: 1px solid #ddd;
        }

        .AlreadyRegUsers h2 {
            font-size: 20px;
            margin-top: 0;
        }

        #userList {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #userList li {
            background-color: #f5f5f5;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 5px;
        }

        .no-users {
            color: #888;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Create Account -->
        <div class="card">

            <h1>Create Account</h1>

            <form id="SignUp_Form">

                <div class="InputBox">
                    <label for="username">Username:</label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        required
                    >
                </div>

                <div class="InputBox">
                    <label for="password">Password:</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >
                </div>

                <button type="submit">
                    Create Account
                </button>

            </form>

            <hr>

            <!-- Already Registered Users -->
            <div class="AlreadyRegUsers">

                <h2>Already Registered Users</h2>

                <ul id="userList">
                    <li class="no-users">
                        No registered users yet.
                    </li>
                </ul>

            </div>

        </div>

    </div>


    <script>

        // Page loaded
        window.onload = function () {

            fetch("http://10.25.2.78:2000/getAllUsers")
                .then(response => response.json())
                .then(users => {
                    const userList = document.getElementById("userList");
                    userList.innerHTML = ""; // Clear existing list

                    let k = 0

                    users.forEach(user => {
                        k++;
                        const listItem = document.createElement("li");
                        listItem.textContent = user.name;
                        userList.appendChild(listItem);
                    });

                    if(k == 0)
                    {
                        const noUsers = document.createElement("li");
                        noUsers.textContent = "No registered users yet.";
                        noUsers.classList.add("no-users");
                        userList.appendChild(noUsers);
                    }
                });

        };


        // Form submit
        const form = document.getElementById("SignUp_Form");

        form.addEventListener("submit", function (event) {

            // Prevent page refresh
            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;


            // Check username and password
            if (username === "" || password === "") {
                return;
            }


            // Remove "No registered users yet."
            const noUsers =
                document.querySelector(".no-users");

            if (noUsers) {
                noUsers.remove();
            }


            // Create new list item
            const listItem =
                document.createElement("li");

            listItem.textContent = username;


            // Add username to list
            document
                .getElementById("userList")
                .appendChild(listItem);


            // Clear form
            form.reset();


            try {
            fetch(`http://10.25.2.78:2000/createUser?username=${username}&password=${password}`)
            .then(res => res.json())
            .then(data => {

                if(data == 'Created')
            {
                //Add this user to list
                const userList = document.getElementById("userList");
                const listItem = document.createElement("li");
                listItem.textContent = data.username;
                userList.appendChild(listItem);
            }
            else {
                
                alert("Error")
                console.log(data);
            }

                
            })
            } catch (error) {
                console.error("Error creating user:", error);
            }

        });
    </script>

</body>
</html>
